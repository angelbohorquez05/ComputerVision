name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    # Fast: no data, no training. The end-to-end test skips itself here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest

  end-to-end:
    # From a clean clone: download the exact data and models, reproduce the
    # published detector metrics, and run the full test suite against them.
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download datasets and models
        run: python -m src.data download
      - name: Reproduce the detector evaluation
        run: |
          python -m src.evaluate detector
          python -c "import json; m = json.load(open('models/detector_eval.json')); assert m['ap50_95'] >= 0.85 and m['specificity'] == 1.0, m"
      - name: All tests, including end-to-end
        run: pytest
