[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leaftrace"
version = "1.0.0"
description = "Helopeltis damage detection and growth-stage risk on tea leaves (YOLOv8 + ONNX)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]
